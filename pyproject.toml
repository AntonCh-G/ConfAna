[project]
name = "confana"
version = "0.1.1"
description = "Conformer analysis workflow for PIMD/MD trajectories"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "plotly>=5.0",
    "click>=8.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.63.0",
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
confana = "src.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.interactive_assets" = [
    "page.html",
    "viewer.css",
    "viewer.js",
    "vendor/3Dmol-min.js",
    "vendor/LICENSE-3dmol.txt",
    "vendor/README.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives generated pages in headless Chromium (needs `python -m playwright install chromium --no-shell`)",
]
