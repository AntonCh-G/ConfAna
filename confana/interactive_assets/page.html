<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$html_title</title>
<style>
$inline_css
</style>
</head>
<body>
<script id="page-data" type="application/json">$page_data_json</script>
<div class="ca-app">
  <header class="ca-header">
    <div class="ca-header-main">
      <span id="hdr-title" class="ca-header-title"></span>
      <span class="ca-header-stats">
        <span id="hdr-frame-count"></span> frames &middot;
        <span id="hdr-bin-count"></span> bins &middot;
        <span id="hdr-scale-mode"></span>
      </span>
      <nav id="pair-nav" class="ca-pair-nav" aria-label="Coordinate pairs" hidden></nav>
    </div>
    <div class="ca-header-sub">
      <span class="ca-subtitle-stack"><span id="hdr-subtitle" class="ca-subtitle">$subtitle</span></span>
      <div id="scale-controls" class="ca-scale-controls" hidden>
        <div class="ca-segmented" role="group" aria-label="Colour scale">
          <button type="button" class="ca-segment" data-scale="log_counts">log counts</button>
          <button type="button" class="ca-segment" data-scale="counts">counts</button>
          <button type="button" class="ca-segment" data-scale="free_energy">free-energy-like</button>
        </div>
        <span id="fe-controls" class="ca-fe-controls" hidden>
          <label class="ca-fe-field">T
            <input id="fe-temperature" type="number" min="0" step="any" inputmode="decimal" aria-label="Temperature in kelvin"> K
          </label>
          <select id="fe-unit" aria-label="Energy unit"></select>
          <span id="fe-hint" class="ca-fe-hint" hidden></span>
        </span>
      </div>
      $state_controls
      <button id="theme-toggle" type="button" class="ca-btn">Theme</button>
    </div>
  </header>
  <div class="ca-layout">
    <main class="ca-map">
$plot_fragment
    </main>
    <aside id="side-panel" class="ca-panel">
      <section id="axis-legend" class="ca-axis-legend" hidden></section>
      <section id="preview-3d" class="ca-preview" hidden>
        <div id="preview-viewer" class="ca-preview-viewer"></div>
      </section>
      <section id="preview-metadata" class="ca-preview-meta" hidden>
        <div id="preview-status" class="ca-preview-status">Hover over the map to preview a bin</div>
        <div id="preview-readout" class="ca-readout"></div>
        <details class="ca-more">
          <summary>More info</summary>
          <div id="preview-meta" class="ca-card-meta"></div>
        </details>
      </section>
      <div id="panel-notice" class="ca-notice" role="status" aria-live="polite" hidden></div>
      <section id="comparison-tray">
        <div class="ca-tray-header">
          <b>Pinned structures</b>
          <button id="comparison-clear" type="button" class="ca-btn">Clear all</button>
        </div>
        <div id="comparison-cards" class="ca-cards"></div>
      </section>
    </aside>
  </div>
</div>
$threedmol_tag
<script>
$inline_js
</script>
</body>
</html>
