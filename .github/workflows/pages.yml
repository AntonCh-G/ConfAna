# Publishes docs/demo/ as a live site. Needs GitHub Pages enabled with
# "Source: GitHub Actions" (Settings -> Pages).
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the demo
        run: |
          mkdir _site
          cp docs/demo/*.html _site/
          cp _site/density_dihedral.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
